<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>For You</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Outfit:wght@300;400;500;600&display=swap');

:root{
  /* ---- palette: warm dial / ember tones ---- */
  --maroon-950:#210709;
  --maroon-900:#33090c;
  --maroon-800:#521015;
  --ember-700:#7a1c17;
  --ember-500:#b23a20;
  --ember-400:#d9552c;
  --gold-300:#f4c98a;
  --gold-200:#ffdfb0;
  --cream-100:#fff4e8;
  --error-500:#ff6b5e;

  --font-display:'Fraunces', serif;
  --font-body:'Outfit', sans-serif;

  --ease-soft: cubic-bezier(.22,.9,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{
  height:100%;
  margin:0;
  padding:0;
}

body{
  font-family:var(--font-body);
  color:var(--cream-100);
  background:var(--maroon-950);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

.phase{
  position:fixed;
  inset:0;
  display:none;
}
.phase.active{
  display:flex;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  background:none;
  color:inherit;
}

a{ color:inherit; }

::selection{
  background:var(--ember-400);
  color:var(--cream-100);
}

/* subtle shared grain overlay for a hand-made, non-flat feel */
.grain{
  pointer-events:none;
  position:absolute;
  inset:0;
  opacity:.05;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
#phase-login{
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(120% 90% at 50% -10%, #6e1c19 0%, transparent 60%),
    linear-gradient(180deg, var(--maroon-900) 0%, var(--maroon-950) 55%, #170405 100%);
}

.login-wrap{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:min(92vw, 380px);
  padding:32px 0 48px;
  animation:riseIn .9s var(--ease-soft) both;
}

@keyframes riseIn{
  from{ opacity:0; transform:translateY(18px); }
  to{ opacity:1; transform:translateY(0); }
}

/* ---- hand-drawn ring behind the lock mark ---- */
.dial-mark{
  position:relative;
  width:88px;
  height:88px;
  margin-bottom:22px;
}
.dial-mark svg{ width:100%; height:100%; }
.dial-mark .ring{
  fill:none;
  stroke:var(--gold-300);
  stroke-width:1.4;
  opacity:.55;
  stroke-linecap:round;
}
.dial-mark .pin{
  fill:var(--gold-200);
}

.login-eyebrow{
  font-size:12.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold-300);
  opacity:.75;
  margin:0 0 8px;
}

.login-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:26px;
  margin:0 0 6px;
  text-align:center;
  color:var(--cream-100);
}
.login-title em{
  font-style:italic;
  font-weight:500;
  color:var(--gold-200);
}

.login-hint{
  font-size:13px;
  color:var(--gold-300);
  opacity:.6;
  margin:0 0 26px;
  text-align:center;
}

/* ---- progress dots ---- */
.code-dots{
  display:flex;
  gap:10px;
  margin-bottom:34px;
}
.code-dots .dot{
  width:11px;
  height:11px;
  border-radius:50%;
  border:1.4px solid var(--gold-300);
  background:transparent;
  transition:background .25s var(--ease-soft), transform .25s var(--ease-soft), border-color .25s;
}
.code-dots .dot.filled{
  background:var(--gold-200);
  border-color:var(--gold-200);
  transform:scale(1.1);
}
.code-dots.shake{
  animation:shakeRow .42s;
}
.code-dots.shake .dot{
  border-color:var(--error-500);
  background:var(--error-500);
}
@keyframes shakeRow{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-8px); }
  40%{ transform:translateX(7px); }
  60%{ transform:translateX(-5px); }
  80%{ transform:translateX(3px); }
}

/* ---- keypad ---- */
.keypad{
  display:grid;
  grid-template-columns:repeat(3, 72px);
  gap:16px 20px;
  justify-content:center;
}

.key{
  position:relative;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-display);
  font-size:22px;
  font-weight:500;
  color:var(--cream-100);
  background:
    radial-gradient(120% 120% at 30% 25%, rgba(255,223,176,.14), rgba(255,223,176,0) 55%),
    linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
  border:1px solid rgba(244,201,138,.22);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.08),
    0 6px 14px rgba(0,0,0,.35);
  transition:transform .15s var(--ease-soft), background .15s, box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.key:hover{
  border-color:rgba(244,201,138,.4);
}
.key:active,
.key.pressed{
  transform:scale(.92);
  background:
    radial-gradient(120% 120% at 30% 25%, rgba(255,223,176,.22), rgba(255,223,176,0) 55%),
    linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.02));
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.35),
    0 2px 6px rgba(0,0,0,.3);
}

.key.key-empty{
  background:none;
  border:none;
  box-shadow:none;
  pointer-events:none;
}

.key.key-back{
  font-size:19px;
  color:var(--gold-300);
}
.key.key-back svg{
  width:22px;
  height:22px;
}

/* subtle concentric dial rings behind the whole pad, decorative */
.dial-rings{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:0;
}
.dial-rings svg{
  width:min(150vw, 900px);
  height:min(150vw, 900px);
  opacity:.06;
}

.login-error{
  min-height:18px;
  margin-top:18px;
  font-size:12.5px;
  color:var(--error-500);
  opacity:0;
  transition:opacity .25s;
  text-align:center;
}
.login-error.show{ opacity:1; }
#phase-loading{
  align-items:center;
  justify-content:center;
  background:#050202;
}

.loading-wrap{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}

/* faint red glow breathing behind the number, like a coal */
.loading-glow{
  position:absolute;
  width:340px;
  height:340px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(178,32,20,.35) 0%, rgba(178,32,20,0) 70%);
  filter:blur(4px);
  animation:glowBreathe 1s ease-in-out infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes glowBreathe{
  0%,100%{ opacity:.55; transform:translate(-50%,-50%) scale(.94); }
  50%{ opacity:1; transform:translate(-50%,-50%) scale(1.04); }
}

.loading-number{
  position:relative;
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(90px, 26vw, 168px);
  line-height:1;
  color:#c81e1e;
  text-shadow:
    0 0 18px rgba(200,30,30,.55),
    0 0 46px rgba(200,30,30,.25);
  -webkit-font-smoothing:antialiased;
}

.loading-number.tick{
  animation:tickPulse .62s var(--ease-soft);
}
@keyframes tickPulse{
  0%{ opacity:0; transform:scale(.82); filter:blur(2px); }
  35%{ opacity:1; transform:scale(1.06); filter:blur(0); }
  100%{ opacity:1; transform:scale(1); }
}

.loading-caption{
  position:relative;
  font-family:var(--font-body);
  font-weight:300;
  font-size:13px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#7a2b23;
  opacity:.8;
}

.loading-dots{
  position:relative;
  display:inline-flex;
  gap:5px;
  margin-left:2px;
}
.loading-dots span{
  width:3px;
  height:3px;
  border-radius:50%;
  background:#7a2b23;
  opacity:.4;
  animation:dotBlink 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2){ animation-delay:.2s; }
.loading-dots span:nth-child(3){ animation-delay:.4s; }
@keyframes dotBlink{
  0%,80%,100%{ opacity:.25; }
  40%{ opacity:.9; }
}

/* scattered faint embers drifting upward, sparse and slow */
.ember-field{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}
.ember{
  position:absolute;
  bottom:-10px;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#c81e1e;
  opacity:0;
  box-shadow:0 0 6px 1px rgba(200,30,30,.6);
  animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%{ opacity:0; transform:translateY(0) translateX(0); }
  10%{ opacity:.7; }
  90%{ opacity:.3; }
  100%{ opacity:0; transform:translateY(-100vh) translateX(var(--drift, 20px)); }
}

</style>
</head>
<body>

  <!-- ============ PHASE 1: LOGIN ============ -->
  <section id="phase-login" class="phase active">
    <div class="grain"></div>

    <div class="dial-rings" aria-hidden="true">
      <svg viewBox="0 0 400 400">
        <circle cx="200" cy="200" r="190" fill="none" stroke="#f4c98a" stroke-width="1"/>
        <circle cx="200" cy="200" r="150" fill="none" stroke="#f4c98a" stroke-width="1"/>
        <circle cx="200" cy="200" r="110" fill="none" stroke="#f4c98a" stroke-width="1"/>
      </svg>
    </div>

    <div class="login-wrap">

      <div class="dial-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <path class="ring" d="M50,10 C74,10 90,28 91,50 C92,73 74,90 51,90 C29,91 11,75 10,53 C9,32 24,12 47,10.5"/>
          <circle class="pin" cx="50" cy="46" r="7"/>
          <path class="pin" d="M43 54 Q50 70 57 54 Z"/>
        </svg>
      </div>

      <p class="login-eyebrow">for you, only</p>
      <h1 class="login-title">Enter the code to <em>begin</em></h1>
      <p class="login-hint">a date you'll never forget</p>

      <div class="code-dots" id="codeDots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <span class="key key-empty" aria-hidden="true"></span>
        <button class="key" data-key="0">0</button>
        <button class="key key-back" data-key="back" aria-label="Delete last digit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"/>
            <path d="M14 10l4 4M18 10l-4 4"/>
          </svg>
        </button>
      </div>

      <p class="login-error" id="loginError">that's not quite it — try again</p>
    </div>
  </section>

  <!-- ============ PHASE 2: LOADING ============ -->
  <section id="phase-loading" class="phase">
    <div class="ember-field" id="emberField"></div>
    <div class="loading-wrap">
      <div class="loading-glow" aria-hidden="true"></div>
      <div class="loading-number" id="loadingNumber">10</div>
      <p class="loading-caption">
        loading something special
        <span class="loading-dots"><span></span><span></span><span></span></span>
      </p>
    </div>
  </section>

  <!-- ============ PHASE 3+ placeholder (built next) ============ -->
  <section id="phase-next" class="phase" style="align-items:center;justify-content:center;background:#0c0203;">
    <p style="font-family:'Outfit',sans-serif;color:#f4c98a;opacity:.6;letter-spacing:.05em;">
      Phase 2 complete — next phase coming next ✦
    </p>
  </section>

  <script>
(function () {
  const PASSCODE = "26072008";

  const dotsWrap   = document.getElementById("codeDots");
  const dots       = dotsWrap ? Array.from(dotsWrap.querySelectorAll(".dot")) : [];
  const keypad     = document.getElementById("keypad");
  const errorLabel = document.getElementById("loginError");

  let entered = "";
  let locked  = false; // true while a wrong-code shake/reset is playing

  function updateDots() {
    dots.forEach((dot, i) => {
      dot.classList.toggle("filled", i < entered.length);
    });
  }

  function showError(msg) {
    errorLabel.textContent = msg;
    errorLabel.classList.add("show");
  }

  function clearError() {
    errorLabel.classList.remove("show");
  }

  function resetEntry({ shake = false } = {}) {
    locked = true;
    if (shake) {
      dotsWrap.classList.add("shake");
      showError("that's not quite it — try again");
    }
    setTimeout(() => {
      entered = "";
      updateDots();
      dotsWrap.classList.remove("shake");
      locked = false;
    }, shake ? 480 : 0);
  }

  function handleSuccess() {
    locked = true;
    clearError();
    dots.forEach((dot) => dot.classList.add("filled"));
    try { localStorage.setItem("bday_phase", "loading"); } catch (e) {}

    // brief celebratory pause on the filled dots before the screen transitions
    setTimeout(() => {
      window.dispatchEvent(new CustomEvent("loginSuccess"));
    }, 550);
  }

  function pressDigit(value) {
    if (locked) return;
    clearError();

    if (value === "back") {
      entered = entered.slice(0, -1);
      updateDots();
      return;
    }

    if (entered.length >= PASSCODE.length) return;

    entered += value;
    updateDots();

    if (entered.length === PASSCODE.length) {
      if (entered === PASSCODE) {
        handleSuccess();
      } else {
        resetEntry({ shake: true });
      }
    }
  }

  function flashKey(el) {
    el.classList.add("pressed");
    setTimeout(() => el.classList.remove("pressed"), 140);
  }

  if (keypad) {
    keypad.addEventListener("click", (e) => {
      const btn = e.target.closest(".key[data-key]");
      if (!btn) return;
      flashKey(btn);
      pressDigit(btn.dataset.key);
    });
  }

  // allow physical keyboard too (handy for desktop testing, harmless on mobile)
  window.addEventListener("keydown", (e) => {
    const loginPhase = document.getElementById("phase-login");
    if (!loginPhase || !loginPhase.classList.contains("active")) return;

    if (/^[0-9]$/.test(e.key)) {
      const btn = keypad.querySelector(`.key[data-key="${e.key}"]`);
      if (btn) flashKey(btn);
      pressDigit(e.key);
    } else if (e.key === "Backspace") {
      const btn = keypad.querySelector('.key[data-key="back"]');
      if (btn) flashKey(btn);
      pressDigit("back");
    }
  });

  updateDots();
})();
(function () {
  const numberEl  = document.getElementById("loadingNumber");
  const emberField = document.getElementById("emberField");
  let intervalId = null;
  let started = false;

  function spawnEmbers(count) {
    if (!emberField) return;
    emberField.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const e = document.createElement("span");
      e.className = "ember";
      const left = Math.random() * 100;
      const duration = 4 + Math.random() * 4;
      const delay = Math.random() * 6;
      const drift = (Math.random() * 40 - 20).toFixed(0) + "px";
      e.style.left = left + "vw";
      e.style.setProperty("--drift", drift);
      e.style.animationDuration = duration + "s";
      e.style.animationDelay = delay + "s";
      emberField.appendChild(e);
    }
  }

  function setNumber(n) {
    numberEl.textContent = n;
    numberEl.classList.remove("tick");
    // force reflow so the animation replays each tick
    void numberEl.offsetWidth;
    numberEl.classList.add("tick");
  }

  function runCountdown() {
    let n = 10;
    setNumber(n);
    intervalId = setInterval(() => {
      n -= 1;
      if (n <= 0) {
        clearInterval(intervalId);
        setTimeout(() => {
          try { localStorage.setItem("bday_phase", "levels"); } catch (e) {}
          window.dispatchEvent(new CustomEvent("loadingComplete"));
        }, 550);
        return;
      }
      setNumber(n);
    }, 850);
  }

  function startLoadingPhase() {
    if (started) return;
    started = true;
    spawnEmbers(22);
    runCountdown();
  }

  window.addEventListener("enterLoading", startLoadingPhase);

  // expose for main.js in case it needs to trigger manually
  window.__startLoadingPhase = startLoadingPhase;
})();
(function () {
  function goTo(phaseId) {
    document.querySelectorAll(".phase").forEach((el) => el.classList.remove("active"));
    const next = document.getElementById(phaseId);
    if (next) next.classList.add("active");
  }

  window.addEventListener("loginSuccess", () => {
    goTo("phase-loading");
    window.dispatchEvent(new CustomEvent("enterLoading"));
  });

  window.addEventListener("loadingComplete", () => {
    goTo("phase-next");
  });

  // NOTE: once Phase 3 (level map) is built, "loadingComplete" will
  // route to "phase-levels" instead of the placeholder "phase-next".
})();

</script>
</body>
</html>
